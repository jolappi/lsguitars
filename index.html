<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lapland Shaman Guitars — Under construction</title>
<meta name="description" content="One-of-a-kind electric guitars handmade in Nokia, Finland. Our new website is under construction.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23101313' stroke='%23c17645' stroke-width='3'/%3E%3Ctext x='32' y='41' text-anchor='middle' font-family='Georgia,serif' font-size='24' fill='%23e7e1d5'%3ELS%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --ink: #101313;
    --paper: #e7e1d5;
    --copper: #c17645;
    --muted: #8f928f;
    --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ink);
    color: var(--paper);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  main {
    min-height: 100%;
    display: grid;
    grid-template-rows: 1fr auto;
    padding: 0 7.5vw;
    background:
      radial-gradient(ellipse at 85% 20%, rgba(193, 118, 69, .16), transparent 55%),
      radial-gradient(ellipse at 10% 90%, rgba(159, 184, 196, .07), transparent 50%);
  }
  .content {
    align-self: center;
    max-width: 920px;
    padding: 80px 0 40px;
  }
  .mark {
    width: 52px;
    height: 52px;
    display: grid;
    place-items: center;
    border: 1px solid currentColor;
    border-radius: 50%;
    font-family: var(--serif);
    font-size: 17px;
    margin-bottom: 56px;
  }
  .eyebrow {
    margin: 0 0 22px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .24em;
    text-transform: uppercase;
  }
  .eyebrow::before {
    content: "";
    display: inline-block;
    width: 30px;
    height: 1px;
    margin-right: 13px;
    vertical-align: middle;
    background: var(--copper);
  }
  h1 {
    margin: 0;
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(54px, 9vw, 120px);
    line-height: .9;
    letter-spacing: -.04em;
  }
  h1 i { color: var(--copper); }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    margin: 44px 0 18px;
    padding: 10px 16px;
    border: 1px solid var(--copper);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .16em;
    text-transform: uppercase;
  }
  .status::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--copper);
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: .25; } }
  .copy {
    max-width: 460px;
    margin: 0;
    color: rgba(255, 255, 255, .62);
  }
  footer {
    padding: 22px 0 28px;
    border-top: 1px solid rgba(255, 255, 255, .13);
    color: #626460;
    font-size: 9px;
    letter-spacing: .12em;
    text-transform: uppercase;
  }
  @media (prefers-reduced-motion: reduce) {
    .status::before { animation: none; }
  }
</style>
</head>
<body>
<main>
  <div class="content">
    <div class="mark" aria-hidden="true">LS</div>
    <p class="eyebrow">Handmade in Nokia, Finland</p>
    <h1>Lapland Shaman<br><i>Guitars</i></h1>
    <p class="status">Under construction</p>
    <p class="copy">One-of-a-kind electric guitars, built slowly and by hand. Our new website is on the workbench and will be ready soon.</p>
  </div>
  <footer>© 2026 Lapland Shaman Guitars</footer>
</main>
</body>
</html>
